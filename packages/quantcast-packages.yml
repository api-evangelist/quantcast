note: >-
  Exactly one first-party Quantcast client library is currently maintained —
  the browser events SDK for the Conversion API. Every other published
  package is a Measure-era mobile SDK that Quantcast has explicitly marked
  DEPRECATED in its own README ("Quantcast no longer supports mobile in app
  measurement at this time"), with last releases between 2015 and 2020.
  There is NO client library of any kind for the Quantcast Platform GraphQL
  API in any registry — the documented integration path is a raw HTTP POST
  or the published Postman collection.
