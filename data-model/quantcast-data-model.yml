domain_summary: >-
  Organization owns Accounts and contains Users; a User is assigned to
  Accounts (directly by Role, or through a Team); an Account contains
  Campaigns; a Campaign contains Ad Sets; an Ad Set delivers Creatives
  through Creative Assignments. Reporting hangs off the Account.
