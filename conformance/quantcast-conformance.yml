note: >-
  Quantcast's cross-cutting standards posture is concentrated in two places:
  OAuth 2.0 / OIDC for platform API access (delegated to an Okta tenant), and
  the IAB privacy and taxonomy suite for the tagging and targeting surface.
  It publishes no security-certification program (no SOC 2 / ISO 27001 /
  PCI attestation page was found on any Quantcast host), so no Compliance
  pointer is emitted.
standards:
- id: oauth2
  name: OAuth 2.0 (RFC 6749)
  conforms: true
  evidence: >-
    Client-credentials grant against
    https://auth.quantcast.com/oauth2/default/v1/token with HTTP Basic client
    authentication, returning token_type Bearer, expires_in and scope.
  source: https://developers.quantcast.com/docs/get-started/authentication/
- id: rfc8414-oauth-authorization-server-metadata
  name: OAuth 2.0 Authorization Server Metadata (RFC 8414)
  conforms: true
  evidence: >-
    https://auth.quantcast.com/.well-known/oauth-authorization-server returns
    200 with a valid metadata document.
  artifact: well-known/quantcast-oauth-authorization-server.json
- id: oidc-discovery
  name: OpenID Connect Discovery 1.0
  conforms: true
  evidence: >-
    https://auth.quantcast.com/.well-known/openid-configuration returns 200
    with issuer, authorization_endpoint, token_endpoint, userinfo_endpoint,
    jwks_uri, registration_endpoint and RS256 id_token signing. Scope is
    platform user sign-in, not the Platform API.
  artifact: well-known/quantcast-openid-configuration.json
- id: rfc6750-bearer-token
  name: OAuth 2.0 Bearer Token Usage (RFC 6750)
  conforms: true
  evidence: 'Authorization: Bearer <access_token> header required on every GraphQL request.'
  source: https://developers.quantcast.com/docs/graphql-api/usage/requests-to-graphql/
- id: graphql
  name: GraphQL
  conforms: true
  evidence: >-
    Single POST endpoint at /api/v2/graphql; published schema reference for
    queries, objects, enums, input objects and scalars; Relay-style
    edges/pageInfo connection shape; rate-limit metadata returned under the
    spec's `extensions` key.
  source: https://developers.quantcast.com/docs/graphql-api/
- id: iab-tcf-v2
  name: IAB Europe Transparency & Consent Framework v2
  conforms: true
  evidence: >-
    The Conversion API token endpoint accepts gdpr and gdpr_consent (a
    Base64-URL TC string) and may refuse to issue a token without adequate
    consent signals. Quantcast Choice, the company's own TCF v2 CMP, was
    divested to InMobi in August 2023.
  source: https://help.quantcast.com/docs/tagging-with-the-quantcast-live-tag-using-the-conversion-api
- id: iab-us-privacy
  name: IAB US Privacy (CCPA) API
  conforms: true
  evidence: 'us_privacy parameter accepted on the token endpoint; documented as deprecated in favour of GPP.'
  source: https://help.quantcast.com/docs/tagging-with-the-quantcast-live-tag-using-the-conversion-api
- id: iab-gpp
  name: IAB Global Privacy Platform
  conforms: true
  evidence: 'gpp and gpp_sid parameters accepted on the token endpoint; documented as the preferred signal.'
  source: https://help.quantcast.com/docs/tagging-with-the-quantcast-live-tag-using-the-conversion-api
- id: iab-content-taxonomy-2.1
